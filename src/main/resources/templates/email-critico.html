<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova avaliação crítica</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<div style="max-width:640px;margin:0 auto;padding:24px;">
    <div style="background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
        <div style="background-color:#b91c1c;padding:20px 24px;">
            <h1 style="margin:0;color:#ffffff;font-size:20px;">Nova avaliação crítica</h1>
        </div>
        <div style="padding:24px;">
            <p style="margin:0 0 16px;font-size:15px;line-height:1.55;">
                Uma avaliação com nota baixa foi recebida e precisa de atenção.
            </p>

            <table style="width:100%;border-collapse:collapse;font-size:14px;">
                <tr>
                    <th style="text-align:left;padding:8px 10px;background-color:#f9fafb;border-bottom:1px solid #e5e7eb;width:130px;">Descrição</th>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;">{{descricao}}</td>
                </tr>
                <tr>
                    <th style="text-align:left;padding:8px 10px;background-color:#f9fafb;border-bottom:1px solid #e5e7eb;">Urgência</th>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;color:#b91c1c;font-weight:bold;">{{urgencia}}</td>
                </tr>
                <tr>
                    <th style="text-align:left;padding:8px 10px;background-color:#f9fafb;border-bottom:1px solid #e5e7eb;">Nota</th>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;">{{nota}}/10</td>
                </tr>
                <tr>
                    <th style="text-align:left;padding:8px 10px;background-color:#f9fafb;border-bottom:1px solid #e5e7eb;">Data de envio</th>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;">{{dataEnvio}}</td>
                </tr>
                <tr>
                    <th style="text-align:left;padding:8px 10px;background-color:#f9fafb;">ID</th>
                    <td style="padding:8px 10px;font-family:Consolas,monospace;font-size:12px;">{{id}}</td>
                </tr>
            </table>

            <p style="margin:20px 0 0;font-size:13px;color:#6b7280;">
                E-mail automático gerado pela plataforma de feedback de aulas — FIAP Fase 4.
            </p>
        </div>
    </div>
</div>
</body>
</html>
